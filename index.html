  padding:12px 14px;font-family:var(--mono);font-size:11px;color:var(--errfg);margin-bottom:12px;line-height:1.7}
.foot{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.8;padding:6px 4px 0}

.note-src{font-family:var(--mono);font-size:10px;color:var(--gold);margin:2px 0 6px}
.group{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--haze);margin:2px 2px 9px;display:flex;align-items:center;gap:10px}
.group+.city{margin-top:0}
.city+.group{margin-top:20px}
.group i{flex:1;height:1px;background:var(--rule);font-style:normal}
.group b{font-weight:500;letter-spacing:.14em}
.group.both{color:var(--gain)}
.group.one{color:var(--obs)}

.tally b{color:var(--gain);font-weight:500}

</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>Daily<i>·</i>Highs<span style="color:var(--cool)">&amp;Lows</span></h1>
    <select class="refresh" id="fCity" aria-label="Filter city"><option value="">All cities</option></select>
    <select class="refresh" id="fState" aria-label="Filter by settled state">
      <option value="">Settled first</option>
      <option value="settled">Settled only</option>
      <option value="play">Still in play</option>
      <option value="az">A–Z</option>
    </select>
    <button class="refresh" id="th" aria-label="Toggle light or dark theme">☀</button>
    <button class="refresh" id="rf">Refresh</button>
    <div class="when" id="when">—</div>
  </div>
  <div class="htrust" id="trust"></div>
</header>
<main><div id="errs"></div><div id="list"></div><p class="foot" id="foot"></p></main>

<script>
/* ══════════════════════════════════════════════════════════════════════
   HIGHS AND LOWS on the exact stations Kalshi settles.

   The low is not the high upside down. Three things invert:

   1. THE BOUND FLIPS. Today's observed max is a FLOOR on the high.
      Today's observed min is a CEILING on the low — it can only go
      lower from here, never higher.
   2. THE CLIMATE DAY MATTERS. NWS climate days run midnight to
      midnight LOCAL STANDARD time all year, so under daylight saving
      the window is 1am–1am. The afternoon peak never notices. The
      overnight minimum sits right on that seam, so we compute the low
      over the true climate window and flag it when the calendar-day
      answer would differ.
   3. LOCKING IS HARDER. A high is done once the peak passes. A low is
      NOT done after sunrise — an evening front can undercut the
      morning minimum before the day closes. We only lock the low when
      no remaining hour in the window is forecast to go below it.
   ══════════════════════════════════════════════════════════════════════ */

const CITIES=[
 {id:'KNYC',city:'New York',site:'Central Park',lat:40.7794,lon:-73.9692,tz:'America/New_York'},
 {id:'KMDW',city:'Chicago',site:"Midway — not O'Hare",lat:41.7861,lon:-87.7524,tz:'America/Chicago'},
 {id:'KMIA',city:'Miami',site:'Miami Intl',lat:25.7906,lon:-80.2871,tz:'America/New_York'},
 {id:'KAUS',city:'Austin',site:'Bergstrom',lat:30.1975,lon:-97.6664,tz:'America/Chicago'},
 {id:'KLAX',city:'Los Angeles',site:'LAX',lat:33.9425,lon:-118.4081,tz:'America/Los_Angeles'},
 {id:'KDEN',city:'Denver',site:'Denver Intl',lat:39.8617,lon:-104.6731,tz:'America/Denver'},
 {id:'KPHX',city:'Phoenix',site:'Sky Harbor · no DST',lat:33.4342,lon:-112.0116,tz:'America/Phoenix'},
 {id:'KPHL',city:'Philadelphia',site:'PHL',lat:39.8683,lon:-75.2311,tz:'America/New_York'},
 {id:'KHOU',city:'Houston',site:'Hobby — not Bush',lat:29.6459,lon:-95.2769,tz:'America/Chicago'},
 {id:'KMSP',city:'Minneapolis',site:'MSP',lat:44.8848,lon:-93.2223,tz:'America/Chicago'},
 {id:'KOKC',city:'Oklahoma City',site:'Will Rogers',lat:35.3931,lon:-97.6008,tz:'America/Chicago'},
 {id:'KSFO',city:'San Francisco',site:'SFO',lat:37.6188,lon:-122.3750,tz:'America/Los_Angeles'},
 {id:'KDCA',city:'Washington',site:'National',lat:38.8512,lon:-77.0402,tz:'America/New_York'},
 {id:'KBOS',city:'Boston',site:'Logan',lat:42.3606,lon:-71.0106,tz:'America/New_York'},
 {id:'KDFW',city:'Dallas',site:'DFW — not Love',lat:32.8998,lon:-97.0403,tz:'America/Chicago'},
 {id:'KSEA',city:'Seattle',site:'SeaTac',lat:47.4444,lon:-122.3138,tz:'America/Los_Angeles'},
 {id:'KLAS',city:'Las Vegas',site:'Harry Reid',lat:36.0840,lon:-115.1537,tz:'America/Los_Angeles'},
 {id:'KATL',city:'Atlanta',site:'Hartsfield',lat:33.6301,lon:-84.4418,tz:'America/New_York'},
 {id:'KSAT',city:'San Antonio',site:'San Antonio Intl',lat:29.5337,lon:-98.4698,tz:'America/Chicago'},
 {id:'KMSY',city:'New Orleans',site:'Armstrong Intl',lat:29.9934,lon:-90.2581,tz:'America/Chicago'},
];
const MODELS=['gfs_hrrr','ncep_nbm_conus','ecmwf_ifs025','gfs_seamless'];
const MLABEL={gfs_hrrr:'HRRR',ncep_nbm_conus:'NBM',ecmwf_ifs025:'ECMWF',gfs_seamless:'GFS'};
const W_NEAR={gfs_hrrr:40,ncep_nbm_conus:30,ecmwf_ifs025:20,gfs_seamless:10};
const W_FAR ={gfs_hrrr:0, ncep_nbm_conus:30,ecmwf_ifs025:42,gfs_seamless:28};
const WET=0.01, LADDER=[0.25,0.5,1,1.5,2,3,4,5,6,7,8,9,10,12,15];

const S={data:{},climo:{},track:{},errs:[],busy:false,ts:null};
let PAL={};
function readPalette(){
  const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue('--'+n).trim();
  PAL={pulse:g('pulse')||'#38BDF8',ember:g('ember')||'#FF6B35',obs:g('obs')||'#C8B4FF',
       cool:g('cool')||'#7DA8FF',haze:g('haze')||'#7C8895',dim:g('dim')||'#4C5764'};
}
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  const b=document.getElementById('th');
  if(b){b.textContent=t==='light'?'☾':'☀';b.setAttribute('aria-label',t==='light'?'Switch to dark theme':'Switch to light theme')}
  readPalette();
}
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const sd=a=>{const m=mean(a);return(m==null||a.length<2)?null:Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayKey=(iso,tz)=>new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso));
const hourIn=(tz,d)=>{const h=+new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',hour12:false}).format(d||new Date());return h===24?0:h};
const hourKeyTz=(d,tz)=>{const f=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).formatToParts(d);
  const g=k=>f.find(p=>p.type===k).value;let h=g('hour');if(h==='24')h='00';
  return `${g('year')}-${g('month')}-${g('day')}T${h.padStart(2,'0')}`};
const isoDay=d=>d.toISOString().slice(0,10);
const daysAgo=n=>isoDay(new Date(Date.now()-n*864e5));
const nextDay=d=>{const[y,m,x]=d.split('-').map(Number);return isoDay(new Date(Date.UTC(y,m-1,x+1)))};
const prevDay=d=>{const[y,m,x]=d.split('-').map(Number);return isoDay(new Date(Date.UTC(y,m-1,x-1)))};
const q=(sorted,p)=>{if(!sorted.length)return null;const i=clamp(p,0,1)*(sorted.length-1),lo=Math.floor(i),hi=Math.ceil(i);
  return lo===hi?sorted[lo]:sorted[lo]+(sorted[hi]-sorted[lo])*(i-lo)};
const store={async get(k){try{if(window.storage){const r=await window.storage.get(k,false);return r?JSON.parse(r.value):null}}catch(e){}return null},
  async set(k,v){try{if(window.storage)await window.storage.set(k,JSON.stringify(v),false)}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const memCache={};
async function jget(u,tries){
  tries=tries||3;
  for(let i=0;i<tries;i++){
    let r;
    try{r=await fetch(u,{headers:{Accept:'application/json'}})}
    catch(e){if(i<tries-1){await sleep(600*(i+1));continue}throw e}
    if(r.status===429||r.status===503||r.status===502){
      const ra=parseFloat(r.headers.get('Retry-After')||'0');
      if(i<tries-1){await sleep(ra?Math.min(ra*1000,10000):Math.min(9000,800*Math.pow(2.6,i)));continue}
      throw new Error(r.status===429?'rate limited':'service busy');
    }
    if(!r.ok)throw new Error(r.status+' '+r.statusText);
    return r.json();
  }
}
async function cachedMem(key,ttl,fn){
  const c=memCache[key];
  if(c&&Date.now()-c.at<ttl)return c.v;
  const v=await fn();
  memCache[key]={at:Date.now(),v};
  return v;
}

/* ── the climate day: midnight–midnight LOCAL STANDARD time ──────── */
function tzOffsetMin(tz,d){
  const s=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'shortOffset'}).format(d);
  const m=/GMT([+-])(\d{1,2})(?::(\d{2}))?/.exec(s);
  if(!m)return 0;
  return (m[1]==='-'?-1:1)*(+m[2]*60+(+(m[3]||0)));
}
function isDST(tz,d){
  const y=(d||new Date()).getUTCFullYear();
  const jan=tzOffsetMin(tz,new Date(Date.UTC(y,0,15)));
  const jul=tzOffsetMin(tz,new Date(Date.UTC(y,6,15)));
  if(jan===jul)return false;                       // Phoenix and friends
  return tzOffsetMin(tz,d||new Date())!==Math.min(jan,jul);
}
/* hour keys covering climate day `date`, in local clock terms */
function climateKeys(date,dst){
  const out=[],start=dst?1:0;
  for(let h=start;h<24;h++)out.push(`${date}T${String(h).padStart(2,'0')}`);
  if(dst)out.push(`${nextDay(date)}T00`);
  return out;
}
/* the climate day that is currently open: under DST the 00:00 hour
   still belongs to yesterday's 1am–1am window */
function climateDate(tz,d){
  d=d||new Date();
  const cal=new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
  if(!isDST(tz,d))return cal;
  let h=+new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',hour12:false}).format(d);
  if(h===24)h=0;
  return h===0?prevDay(cal):cal;
}
function calendarKeys(date){
  const out=[];for(let h=0;h<24;h++)out.push(`${date}T${String(h).padStart(2,'0')}`);return out;
}

/* ── fetch ───────────────────────────────────────────────────────── */
const CHUNK=10, GAP=260;
/* Open-Meteo accepts comma-separated coordinates and returns one block per
   location. One model per call keeps the response shape unambiguous, so the
   whole board costs 4 requests instead of 80. */
async function fetchTempsBatched(){
  const out={};
  for(let i=0;i<CITIES.length;i+=CHUNK){
    const grp=CITIES.slice(i,i+CHUNK);
    const lat=grp.map(c=>c.lat).join(','),lon=grp.map(c=>c.lon).join(',');
    for(const m of MODELS){
      let raw;
      try{
        raw=await cachedMem(`t|${m}|${i}`,9*60000,()=>jget(
          `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
          +`&hourly=temperature_2m&models=${m}&temperature_unit=fahrenheit`
          +`&timezone=auto&forecast_days=6&past_days=2`));
      }catch(e){S.errs.push(`${MLABEL[m]||m} temperatures: ${e.message}`);await sleep(GAP);continue}
      const arr=Array.isArray(raw)?raw:[raw];
      arr.forEach((b,j)=>{
        const c=grp[j];
        if(!c||!b||!b.hourly||!b.hourly.time||!b.hourly.temperature_2m)return;
        (out[c.id]=out[c.id]||{})[m]={t:b.hourly.time,v:b.hourly.temperature_2m};
        if(b.timezone&&b.timezone!==c.tz)S.tzWarn=(S.tzWarn||[]).concat(`${c.city}: ${b.timezone}`);
      });
      await sleep(GAP);
    }
  }
  return out;
}
async function fetchWetBatched(){
  const out={};
  for(let i=0;i<CITIES.length;i+=CHUNK){
    const grp=CITIES.slice(i,i+CHUNK);
    const lat=grp.map(c=>c.lat).join(','),lon=grp.map(c=>c.lon).join(',');
    let raw;
    try{
      raw=await cachedMem(`w|${i}`,9*60000,()=>jget(
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
        +`&hourly=precipitation&daily=precipitation_sum,snowfall_sum,precipitation_probability_max`
        +`&precipitation_unit=inch&timezone=auto&past_days=31&forecast_days=16`));
    }catch(e){S.errs.push(`rain forecast: ${e.message}`);await sleep(GAP);continue}
    const arr=Array.isArray(raw)?raw:[raw];
    arr.forEach((b,j)=>{const c=grp[j];if(c&&b&&b.daily)out[c.id]=b});
    await sleep(GAP);
  }
  return out;
}
async function fetchClimoBatched(){
  const out={};
  for(let i=0;i<CITIES.length;i+=CHUNK){
    const grp=CITIES.slice(i,i+CHUNK);
    const ck='climo_v2_'+i, hit=await store.get(ck);
    if(hit&&Date.now()-hit.at<30*864e5){Object.assign(out,hit.v);continue}
    const lat=grp.map(c=>c.lat).join(','),lon=grp.map(c=>c.lon).join(',');
    let raw;
    try{
      raw=await jget(`https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}`
        +`&start_date=${daysAgo(365*7)}&end_date=${daysAgo(7)}&daily=precipitation_sum`
        +`&precipitation_unit=inch&timezone=auto`);
    }catch(e){S.errs.push(`rain history: ${e.message}`);await sleep(GAP);continue}
    const arr=Array.isArray(raw)?raw:[raw],part={};
    arr.forEach((b,j)=>{const c=grp[j];
      if(!c||!b||!b.daily||!b.daily.time)return;
      part[c.id]=b.daily.time.map((t,k)=>({d:t,v:b.daily.precipitation_sum[k]})).filter(r=>r.v!=null)});
    Object.assign(out,part);
    await store.set(ck,{at:Date.now(),v:part});
    await sleep(GAP);
  }
  return out;
}

async function obs(c){
  const since=new Date(Date.now()-54*36e5).toISOString().replace(/\.\d+Z$/,'Z');
  const d=await jget(`https://api.weather.gov/stations/${c.id}/observations?start=${since}&limit=260`);
  return (d.features||[]).map(f=>{const p=f.properties||{};
    return{t:p.timestamp,
      temp:p.temperature&&p.temperature.value!=null?p.temperature.value*9/5+32:null,
      dew:p.dewpoint&&p.dewpoint.value!=null?p.dewpoint.value*9/5+32:null,
      sky:(p.cloudLayers||[]).map(l=>l.amount).join('/')||'CLR'}})
    .filter(r=>r.temp!=null).sort((a,b)=>new Date(a.t)-new Date(b.t));
}
/* ── grade each model against the thermometer, remove its bias ───── */
function fitBias(mod,obsArr,tz,nowKey){
  const om={};
  obsArr.forEach(o=>{const k=hourKeyTz(new Date(o.t),tz);(om[k]=om[k]||[]).push(o.temp)});
  const per={},all=[];let n=0;
  for(const m in mod){
    const{t,v}=mod[m],errs=[];
    for(let i=0;i<t.length;i++){
      const k=t[i].slice(0,13);
      if(k>nowKey)break;
      const o=om[k];
      if(o&&v[i]!=null)errs.push(v[i]-mean(o));
    }
    if(errs.length>=6){const r=errs.slice(-30);per[m]=mean(r);all.push(...r);n=Math.max(n,r.length)}
  }
  return{per,n,bias:all.length?mean(all):null,rmse:all.length?Math.sqrt(mean(all.map(e=>e*e))):null};
}
/* bias-corrected hourly series per model, keyed YYYY-MM-DDTHH */
function correctedSeries(mod,per){
  const out={};
  for(const m in mod){
    const b=clamp((per&&per[m])||0,-6,6),{t,v}=mod[m],bag={};
    for(let i=0;i<t.length;i++)if(v[i]!=null)bag[t[i].slice(0,13)]=v[i]-b;
    out[m]=bag;
  }
  return out;
}
function blendAt(cs,key,wset){
  const vals=[];let n=0,d=0;
  for(const m in cs){const v=cs[m][key];if(v==null)continue;vals.push(v);const w=wset[m]||0;n+=v*w;d+=w}
  if(!vals.length)return null;
  return{v:d?n/d:mean(vals),spread:vals.length>1?(sd(vals)||0.9):1.2,n:vals.length};
}
function blendWindow(cs,keys,wset){
  const out={};
  for(const k of keys){const b=blendAt(cs,k,wset);if(b)out[k]=b}
  return out;
}

/* ── today's extreme, anchored to the current observation ────────── */
/*  dir = +1 for the high (obs bound is a FLOOR), -1 for the low
    (obs bound is a CEILING).                                        */
function todayExtreme(win,keys,nowKey,obsNow,obsBound,spread,dir){
  const present=keys.filter(k=>win[k]!=null);
  if(!present.length)return null;
  let off=0;
  if(obsNow!=null&&win[nowKey]!=null)off=obsNow-win[nowKey].v;
  const rem=present.filter(k=>k>=nowKey);
  /* decay by real elapsed hours, so a nowKey outside the window (or a gap
     in the series) can't collapse the decay and smear the offset all day */
  const hAbs=k=>Date.UTC(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10),+k.slice(11,13))/36e5;
  const n0=hAbs(nowKey);
  const hrsFrom=k=>Math.max(0,hAbs(k)-n0);
  let best=null,bestKey=null;
  for(const k of rem){
    const v=win[k].v+off*Math.max(0,1-hrsFrom(k)/6);
    if(best==null||(dir>0?v>best:v<best)){best=v;bestKey=k}
  }
  let mu=best,peakKey=bestKey,locked=false;
  if(obsBound!=null){
    const boundWins=(best==null)||(dir>0?obsBound>=best:obsBound<=best);
    if(boundWins){mu=obsBound;peakKey=null}
    /* locked only when nothing left in the window can beat the bound */
    locked = best==null || (dir>0 ? best<=obsBound+0.5 : best>=obsBound-0.5);
  }
  if(mu==null)return null;
  const remFrac=clamp(rem.length/Math.max(present.length,1),0,1);
  const base=Math.max(1.1,(spread||1)*1.25+0.5);
  let sigma=Math.max(0.5,base*Math.max(remFrac,0.12));
  if(locked)sigma=Math.min(sigma,0.6);
  let lo=mu-sigma,hi=mu+sigma;
  if(obsBound!=null){ if(dir>0&&lo<obsBound)lo=obsBound; if(dir<0&&hi>obsBound)hi=obsBound; }
  return{mu,sigma,lo,hi,off,peakKey,locked,remaining:rem.length};
}
/* a later drop below the morning minimum — the classic low-temp trap */
function frontalDrop(win,keys,nowKey,obsBound){
  if(obsBound==null)return null;
  let worst=null,wk=null;
  for(const k of keys){
    if(k<=nowKey||win[k]==null)continue;
    if(win[k].v<obsBound-1&&(worst==null||win[k].v<worst)){worst=win[k].v;wk=k}
  }
  return worst!=null?{v:worst,hr:+wk.slice(11,13)}:null;
}
function modelExtreme(bag,keys,dir,minCov){
  let best=null,n=0;
  for(const k of keys){const v=bag[k];if(v==null)continue;n++;
    if(best==null||(dir>0?v>best:v<best))best=v}
  /* a model that only covers part of the day produces a biased extreme —
     HRRR runs out mid-period and would drag the high down. Require coverage. */
  return (best!=null&&n>=Math.ceil(keys.length*(minCov==null?0.85:minCov)))?{v:best,n}:null;
}
function futureExtreme(cs,keys,wset,dir){
  const vals=[];
  for(const m in cs){
    const e=modelExtreme(cs[m],keys,dir);
    if(e)vals.push({m,v:e.v});
  }
  if(!vals.length)for(const m in cs){          // nothing covers it — fall back
    const e=modelExtreme(cs[m],keys,dir,0.4);
    if(e)vals.push({m,v:e.v});
  }
  if(!vals.length)return null;
  let n=0,d=0;
  vals.forEach(x=>{const w=wset[x.m]||0;n+=x.v*w;d+=w});
  const mu=d?n/d:mean(vals.map(x=>x.v));
  const spread=vals.length>1?(sd(vals.map(x=>x.v))||0.9):1.4;
  return{mu,spread,sigma:Math.max(1.1,spread*1.25+0.5)};
}

/* ── settlement source: NWS Daily Climate Report ─────────────────── */
function cliRows(v){return v?(v.results||v.data||(Array.isArray(v)?v:[v])||[]):[]}
function cliNum(rows,keys,lo,hi){
  for(const x of rows){
    for(const k of keys){
      let raw=x[k];
      if(raw==null&&x.temperature)raw=x.temperature[k];
      if(raw==null||raw==='M'||raw==='T')continue;   // M = missing, T = trace
      const n=parseFloat(raw);
      if(isFinite(n)&&n>=lo&&n<=hi)return n;
    }
    /* a trace still counts as measurable-adjacent but not as 0.01" */
    for(const k of keys)if(x[k]==='T')return 0.005;
  }
  return null;
}
/* Kalshi monthly rain settles on "total monthly precipitation recorded at the
   NWS station, as reported in the Daily Climate Report" — so the CLI is the
   instrument, not a model grid. The CLI for date D carries month-to-date
   through D, which is exactly the banked figure. */
async function fetchCli(stationId,date){
  try{
    const rows=cliRows(await jget(
      `https://mesonet.agron.iastate.edu/json/cli.py?station=${stationId}&date=${date}`));
    if(!rows.length)return null;
    const r=n=>n==null?null:Math.round(n);
    return{
      hi:r(cliNum(rows,['high','high_temperature'],-60,140)),
      lo:r(cliNum(rows,['low','low_temperature'],-60,140)),
      precip:cliNum(rows,['precip','precipitation','precip_today'],0,40),
      precipMonth:cliNum(rows,['precip_month','precipitation_month','month_precip','precip_mtd'],0,300),
      snowMonth:cliNum(rows,['snow_month','snowfall_month','snow_mtd'],0,400)
    };
  }catch(e){return null}
}

/* ── self-scoring track record ───────────────────────────────────── */
function resolveTrack(arr,obsArr,tz,yday,dst){
  const e=arr.find(x=>x.d===yday&&(x.a==null||x.al==null));
  if(e){
    const keys=new Set(climateKeys(yday,dst));
    const yo=obsArr.filter(o=>keys.has(hourKeyTz(new Date(o.t),tz)));
    if(yo.length>=16){
      const temps=yo.map(o=>o.temp);
      if(e.a==null){e.a=Math.round(Math.max(...temps));e.src='obs'}
      if(e.al==null){e.al=Math.round(Math.min(...temps));e.src=e.src||'obs'}
    }
  }
  return arr.filter(x=>x.d>=daysAgo(21));
}
function trackStats(arr){
  const done=arr.filter(x=>x.a!=null).sort((a,b)=>a.d<b.d?-1:1);
  if(!done.length)return null;
  const eh=done.map(x=>x.p-x.a);
  const lows=done.filter(x=>x.pl!=null&&x.al!=null);
  const el=lows.map(x=>x.pl-x.al);
  return{n:done.length,maeHi:mean(eh.map(Math.abs)),
    maeLo:el.length?mean(el.map(Math.abs)):null,nLo:el.length,
    within2:eh.filter(e=>Math.abs(e)<=2).length,last:done[done.length-1]};
}
async function updateTrack(c,tz,today,predHi,predLo,obsArr,dst,cli){
  const k='trk_'+c.id;
  let arr=(await store.get(k))||[];
  const yday=prevDay(today);
  const open=arr.find(x=>x.d===yday&&(x.a==null||x.al==null));
  if(open){
    if(cli){
      if(cli.hi!=null){open.a=cli.hi;open.src='CLI'}
      if(cli.lo!=null){open.al=cli.lo;open.src='CLI'}
    }
  }
  arr=resolveTrack(arr,obsArr,tz,yday,dst);
  if(predHi!=null&&hourIn(tz)<=12&&!arr.find(x=>x.d===today))
    arr.push({d:today,p:Math.round(predHi),pl:predLo!=null?Math.round(predLo):null});
  await store.set(k,arr);
  S.track[c.id]=arr;
}

/* ── derive ──────────────────────────────────────────────────────── */
function derive(c,d){
  if(!d||!d.mod)return null;
  const tz=c.tz,now=new Date();
  const today=climateDate(tz,now);
  const nowHr=hourIn(tz),nowKey=hourKeyTz(now,tz);
  const dst=isDST(tz,now);
  const O=d.obs||[],last=O[O.length-1];

  const bias=fitBias(d.mod,O,tz,nowKey);
  const cs=correctedSeries(d.mod,bias.per);

  const cKeys=climateKeys(today,dst);
  const kSet=new Set(cKeys);
  const win=blendWindow(cs,cKeys,W_NEAR);

  /* observations inside the true climate window */
  const inWin=O.filter(o=>kSet.has(hourKeyTz(new Date(o.t),tz)));
  const obsMax=inWin.length?Math.max(...inWin.map(o=>o.temp)):null;
  const obsMin=inWin.length?Math.min(...inWin.map(o=>o.temp)):null;
  const obsNow=last?last.temp:null;

  const spread=(()=>{const v=[];
    for(const m in cs){const e=modelExtreme(cs[m],cKeys,+1);if(e)v.push(e.v)}
    return v.length>1?(sd(v)||0.9):1.4})();

  const hi=todayExtreme(win,cKeys,nowKey,obsNow,obsMax,spread,+1);
  const lo=todayExtreme(win,cKeys,nowKey,obsNow,obsMin,spread,-1);
  const drop=frontalDrop(win,cKeys,nowKey,obsMin);

  /* does the calendar-day answer differ from the climate-day answer? */
  let seam=null;
  if(dst){
    const calWin=blendWindow(cs,calendarKeys(today),W_NEAR);
    const calObs=O.filter(o=>hourKeyTz(new Date(o.t),tz).slice(0,10)===today);
    const pool=k=>Object.values(k).map(x=>x.v);
    const calLo=Math.min(...pool(calWin).concat(calObs.map(o=>o.temp)));
    const cliLo=Math.min(...pool(win).concat(inWin.map(o=>o.temp)));
    if(isFinite(calLo)&&isFinite(cliLo)&&Math.abs(calLo-cliLo)>=1)
      seam={cal:calLo,cli:cliLo};
  }

  const dates=[...new Set(Object.values(d.mod).flatMap(m=>m.t.map(x=>x.slice(0,10))))]
    .sort().filter(x=>x>today).slice(0,4);
  const future=dates.map((dt,i)=>{
    const ks=climateKeys(dt,isDST(tz,new Date(dt+'T18:00:00Z')));
    const w=i===0?W_NEAR:W_FAR;
    return{dt,hi:futureExtreme(cs,ks,w,+1),lo:futureExtreme(cs,ks,w,-1)};
  }).filter(x=>x.hi&&x.lo);

  return{today,nowHr,nowKey,dst,win,cKeys,hi,lo,drop,seam,future,bias,
    obsMax,obsMin,obsNow,last,inWin,spread};
}

/* ── rain (unchanged) ────────────────────────────────────────────── */
function rainToday(W,tz,today){
  if(!W||!W.daily)return null;
  const di=W.daily.time.indexOf(today);
  const fcast=di>=0?W.daily.precipitation_sum[di]:null;
  const pop=di>=0&&W.daily.precipitation_probability_max?W.daily.precipitation_probability_max[di]:null;
  let fell=0,have=false;const hr=hourIn(tz);
  if(W.hourly&&W.hourly.time)for(let i=0;i<W.hourly.time.length;i++){
    const t=W.hourly.time[i];if(t.slice(0,10)!==today)continue;
    if(+t.slice(11,13)>hr)continue;
    const v=W.hourly.precipitation[i];if(v!=null){fell+=v;have=true}
  }
  const settled=have&&fell>=WET;
  let p=settled?1:(pop!=null?pop/100:(fcast>=WET?0.6:0.1));
  if(!settled&&have&&fcast!=null&&Math.max(0,fcast-fell)<WET/2)p=Math.min(p,0.08);
  return{fell:have?fell:null,settled,p:clamp(p,0,1),fcast,win:rainWindow(W,today,hr)};
}
function rainWindow(W,today,nowHr){
  if(!W.hourly||!W.hourly.time)return null;
  const hrs=[];
  for(let i=0;i<W.hourly.time.length;i++){
    const t=W.hourly.time[i];if(t.slice(0,10)!==today)continue;
    const h=+t.slice(11,13);if(h<nowHr)continue;
    if((W.hourly.precipitation[i]||0)>=WET)hrs.push(h);
  }
  return hrs.length?{a:hrs[0],b:hrs[hrs.length-1]}:null;
}
function monthOutlook(c,W,CL,today,cli){
  if(!W||!W.daily)return null;
  const ym=today.slice(0,7),D=W.daily,T=D.time;
  const lastDay=new Date(Date.UTC(+ym.slice(0,4),+ym.slice(5,7),0)).getUTCDate();
  const todayN=+today.slice(8,10);
  /* grid fallback for everything the gauge can't tell us */
  let gridPrior=0,gridPriorDays=0,todayGrid=0,fc=0,fcDays=0,lastFc=null,snowGrid=0;
  for(let i=0;i<T.length;i++){
    if(T[i].slice(0,7)!==ym)continue;
    const dn=+T[i].slice(8,10),v=D.precipitation_sum[i];
    if(D.snowfall_sum&&D.snowfall_sum[i]!=null)snowGrid+=D.snowfall_sum[i];
    if(v==null)continue;
    if(dn<todayN){gridPrior+=v;gridPriorDays++}
    else if(dn===todayN){todayGrid=v}
    else{fc+=v;fcDays++;lastFc=dn}
  }
  /* today's elapsed hours, so "already fallen" isn't double counted */
  let todaySoFar=0,haveHourly=false;
  if(W.hourly&&W.hourly.time){
    const hr=hourIn(c.tz);
    for(let i=0;i<W.hourly.time.length;i++){
      const t=W.hourly.time[i];
      if(t.slice(0,10)!==today||+t.slice(11,13)>hr)continue;
      const v=W.hourly.precipitation[i];if(v!=null){todaySoFar+=v;haveHourly=true}
    }
  }
  /* the gauge wins when the climate report has it */
  const gauge = cli&&cli.precipMonth!=null;
  const banked = gauge ? cli.precipMonth : gridPrior;
  const bDays  = gauge ? todayN-1 : gridPriorDays;
  const live   = haveHourly?todaySoFar:todayGrid;
  const todayRest = Math.max(0,todayGrid-live);

  const covered=lastFc||todayN,gapStart=covered+1,gapDays=Math.max(0,lastDay-covered);
  let samples=[];
  if(gapDays>0&&CL&&CL.length){
    const byYear={};
    CL.forEach(r=>{const m=r.d.slice(5,7),dn=+r.d.slice(8,10),y=r.d.slice(0,4);
      if(m!==ym.slice(5,7)||dn<gapStart||dn>lastDay)return;
      byYear[y]=(byYear[y]||0)+r.v});
    samples=Object.values(byYear);
  }
  let seed=(c.id.charCodeAt(1)*7919+todayN)>>>0;
  const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
  const gs=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  const floor=banked+live;                       // already in the gauge or on the ground
  const soft=fc+todayRest;                       // forecast, uncertain
  const tot=[],N=3000;
  for(let i=0;i<N;i++){
    const f=soft>0?soft*Math.exp(gs()*0.38):0;
    const g=samples.length?samples[Math.floor(rnd()*samples.length)]*Math.exp(gs()*0.12):0;
    tot.push(floor+f+g);
  }
  tot.sort((a,b)=>a-b);
  const med=q(tot,0.5),lo=q(tot,0.2),hi=q(tot,0.8);
  const P=T0=>tot.filter(x=>x>T0).length/N;
  const above=LADDER.filter(x=>x>med),below=LADDER.filter(x=>x<=med);
  const picks=[below.length?below[below.length-1]:LADDER[0],above.length?above[0]:LADDER[LADDER.length-1]];
  return{banked,bDays,live,fc:soft,fcDays,gapDays,med,lo,hi,lastDay,gauge,
    snow:(cli&&cli.snowMonth!=null)?cli.snowMonth:snowGrid,
    snowGauge:!!(cli&&cli.snowMonth!=null),
    snowUnit:(cli&&cli.snowMonth!=null)?'in':((W.daily_units&&W.daily_units.snowfall_sum)||'cm'),
    climYears:samples.length,
    thresholds:[...new Set(picks)].map(t=>({t,p:floor>t?1:P(t)}))};
}

/* ── load ────────────────────────────────────────────────────────── */
async function load(){
  if(S.busy)return;S.busy=true;S.errs=[];S.tzWarn=null;render();
  const[temps,wets,climos]=[await fetchTempsBatched(),await fetchWetBatched(),await fetchClimoBatched()];
  S.climo=climos;
  CITIES.forEach(c=>{S.data[c.id]=Object.assign(S.data[c.id]||{},
    {mod:temps[c.id]||null,wet:wets[c.id]||null,obs:(S.data[c.id]||{}).obs||[]})});
  render();
  /* per-station calls are unavoidable — throttle them rather than burst */
  for(let i=0;i<CITIES.length;i+=4){
    await Promise.allSettled(CITIES.slice(i,i+4).map(async c=>{
      const d=S.data[c.id];
      try{d.obs=await cachedMem('o|'+c.id,7*60000,()=>obs(c))}
      catch(e){if(S.errs.length<4)S.errs.push(`${c.city} observations: ${e.message}`)}
      d.dx=derive(c,d);
      if(d.dx){
        const yday=prevDay(d.dx.today);
        try{d.cli=await cachedMem('cli|'+c.id+'|'+yday,30*60000,()=>fetchCli(c.id,yday))}catch(e){}
        await updateTrack(c,c.tz,d.dx.today,d.dx.hi?d.dx.hi.mu:null,
          d.dx.lo?d.dx.lo.mu:null,d.obs,d.dx.dst,d.cli);
      }
    }));
    await sleep(180);render();
  }
  S.ts=new Date();S.busy=false;render();
}

/* ── curve: whole climate day, both extremes marked ──────────────── */
function curve(c,d){
  const dx=d.dx;if(!dx||!dx.win)return'';
  const tz=c.tz,W=560,H=88;
  const keys=dx.cKeys.filter(k=>dx.win[k]!=null);
  if(keys.length<5)return'';
  const idx=k=>dx.cKeys.indexOf(k);
  const nowI=idx(dx.nowKey);
  const off=dx.hi?dx.hi.off:0;
  const pts=keys.map(k=>{const i=idx(k);
    return{i,h:+k.slice(11,13),v:dx.win[k].v+(nowI>=0&&i>=nowI?off*Math.max(0,1-(i-nowI)/6):0)}});
  const op=dx.inWin.map(o=>{const k=hourKeyTz(new Date(o.t),tz);return{i:idx(k),v:o.temp}}).filter(p=>p.i>=0);
  const all=pts.map(p=>p.v).concat(op.map(p=>p.v));
  const y0=Math.min(...all)-2,y1=Math.max(...all)+2;
  const N=dx.cKeys.length-1;
  const X=i=>(i/N)*W,Y=v=>H-14-((v-y0)/((y1-y0)||1))*(H-30);
  const line=a=>a.map(p=>`${X(p.i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const fut=pts.filter(p=>p.i>=nowI),past=pts.filter(p=>p.i<=nowI);
  const lab=fut.filter(p=>p.i>nowI&&(p.i-nowI)%4===0).slice(0,4);
  const mark=(ext,color,tag)=>{
    if(!ext)return'';
    let i;
    if(ext.peakKey!=null)i=idx(ext.peakKey);
    else{ /* bound came from observations — mark where that value occurred */
      let b=null,bd=Infinity;
      for(const p of op.concat(pts)){const d2=Math.abs(p.v-ext.mu);
        if(d2<bd-1e-9||(Math.abs(d2-bd)<1e-9&&b!=null&&p.i<b)){bd=d2;b=p.i}}
      i=b==null?nowI:b;
    }
    if(i<0)return'';
    return`<circle cx="${X(i).toFixed(1)}" cy="${Y(ext.mu).toFixed(1)}" r="3" fill="${color}"/>
    <text x="${clamp(X(i),22,W-38).toFixed(1)}" y="${(tag==='hi'?Math.max(9,Y(ext.mu)-7):Math.min(H-16,Y(ext.mu)+13)).toFixed(1)}"
      fill="${color}" font-size="10" font-family="monospace" text-anchor="middle">${Math.round(ext.mu)}°</text>`;
  };
  return`<div class="curve"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
    aria-label="Temperature across the climate day in ${esc(c.city)}">
   ${past.length>1?`<polyline fill="none" stroke="${PAL.pulse}" stroke-width="1.3" stroke-dasharray="2 4" opacity=".4" points="${line(past)}"/>`:''}
   ${fut.length>1?`<polyline fill="none" stroke="${PAL.pulse}" stroke-width="1.8" stroke-dasharray="4 3" points="${line(fut)}"/>`:''}
   ${op.length>1?`<polyline fill="none" stroke="${PAL.obs}" stroke-width="2" points="${line(op)}"/>`:''}
   ${lab.map(p=>`<text x="${X(p.i).toFixed(1)}" y="${(Y(p.v)-6).toFixed(1)}" fill="${PAL.haze}" font-size="9"
     font-family="monospace" text-anchor="middle">${Math.round(p.v)}°</text>
     <text x="${X(p.i).toFixed(1)}" y="${H-1}" fill="${PAL.dim}" font-size="8.5" font-family="monospace" text-anchor="middle">${p.h}h</text>`).join('')}
   ${mark(dx.hi,PAL.ember,'hi')}${mark(dx.lo,PAL.cool,'lo')}
   ${nowI>=0?`<line x1="${X(nowI).toFixed(1)}" y1="0" x2="${X(nowI).toFixed(1)}" y2="${H-12}" stroke="${PAL.dim}" stroke-dasharray="2 4"/>`:''}
  </svg></div>`;
}
function wetBlock(c,d){ /* d.cli = climate report */
  const W=d.wet;if(!W)return'';
  const today=dayKey(new Date().toISOString(),c.tz);
  const R=rainToday(W,c.tz,today),M=monthOutlook(c,W,S.climo[c.id],today,d.cli);
  if(!R&&!M)return'';
  const mn=new Date(today+'T12:00:00').toLocaleDateString([],{month:'long'});
  let out=`<div class="wet"><div style="font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--haze);margin-bottom:9px">Rain &amp; snow</div>`;
  if(R){
    out+=`<div class="wetrow"><u>Today</u>`;
    if(R.settled)out+=`<b class="fell">Already rained</b><span>≈${R.fell.toFixed(2)}" so far</span>`;
    else{out+=`<b>${Math.round(R.p*100)}%</b><span>chance${R.fcast!=null&&R.fcast>=WET?` · ${R.fcast.toFixed(2)}" expected`:''}`;
      if(R.win)out+=` · likely ${R.win.a===R.win.b?R.win.a+'h':R.win.a+'–'+R.win.b+'h'}`;out+=`</span>`}
    out+=`</div>`;
  }
  if(M){
    const tot=Math.max(M.med,0.01);
    const wB=clamp((M.banked+M.live)/tot*100,0,100),wF=clamp(M.fc/tot*100,0,100-wB);
    out+=`<div class="wetrow"><u>${esc(mn)}</u><b class="fell">${(M.banked+M.live).toFixed(2)}"</b>
      <span>${M.gauge?'climate report':'model estimate'} through ${M.bDays} day${M.bDays===1?'':'s'}${
        M.live>=0.005?` + ${M.live.toFixed(2)}" today`:''} · can't un-fall</span></div>
     <div class="bar"><i class="banked" style="width:${wB.toFixed(1)}%"></i><i class="fc" style="width:${wF.toFixed(1)}%"></i></div>
     <div class="wetrow"><u>Month end</u><b>${M.med.toFixed(2)}"</b>
       <span>${M.lo.toFixed(2)}–${M.hi.toFixed(2)}" · ${M.fcDays}d forecast${M.gapDays?` + ${M.gapDays}d from ${M.climYears} yrs`:''}</span></div>`;
    if(!M.gauge)out+=`<div class="note-src">Climate report unavailable — month-to-date is a model estimate, not the settling gauge.</div>`;
    if(M.snow>0.05)out+=`<div class="wetrow"><u>Snow</u><b>${M.snow.toFixed(1)}${M.snowUnit==='in'?'"':''}</b><span>${
      M.snowGauge?'climate report':esc(M.snowUnit)+' — model estimate'} this month</span></div>`;
    out+=`<div class="thr">${M.thresholds.map(x=>{const set=x.p>=0.999,dead=x.p<=0.02;
      return`<div class="tchip ${set?'set':dead?'dead':''}"><u>above ${x.t}"</u>
        <b>${set?'✓ settled':dead?'—':Math.round(x.p*100)+'%'}</b></div>`}).join('')}</div>`;
  }
  return out+`</div>`;
}
function card(c){
  const d=S.data[c.id];
  if(!d)return`<div class="city skel"><div class="name"><b>${esc(c.city)}</b><span class="site">${esc(c.site)}</span></div>
    <div class="pair"><div class="half hi"><u>High</u><em>—</em></div><div class="half lo"><u>Low</u><em>—</em></div></div></div>`;
  const dx=d.dx;
  const head=`<div class="name"><b>${esc(c.city)}</b><span class="site">${esc(c.site)}</span>
    ${dx&&dx.hi&&dx.hi.locked?'<span class="lockbadge">HIGH LOCKED</span>':''}
    ${dx&&dx.lo&&dx.lo.locked?'<span class="lockbadge">LOW LOCKED</span>':''}
    ${dx&&dx.dst?`<span class="lockbadge" style="border-color:var(--rule);color:var(--dim)">CLIMATE DAY ${esc(dx.today.slice(5))} · 1–1</span>`:''}</div>`;
  if(!dx||!dx.hi)return`<div class="city">${head}
    <p style="font-family:var(--mono);font-size:10px;color:var(--haze);margin:12px 0 4px">FORECAST UNAVAILABLE</p>${wetBlock(c,d)}</div>`;
  const agree=clamp(1-(dx.spread-0.6)/4.4,0,1);
  const col=agree>0.66?'var(--gain)':agree>0.35?'var(--gold)':'var(--ember)';
  const word=agree>0.66?'models agree closely':agree>0.35?'some model disagreement':'models disagree a lot';
  const dow=s=>new Date(s+'T12:00:00').toLocaleDateString([],{weekday:'short'});
  const tk=trackStats(S.track[c.id]||[]);
  let chk='';
  if(dx.bias.rmse!=null||tk){
    chk=`<div class="chk">`;
    if(dx.bias.rmse!=null){const b=dx.bias.bias;
      chk+=`24h vs thermometer: models ${Math.abs(b)<0.3?'on target':`ran ${b>0?'hot':'cold'} <b>${Math.abs(b).toFixed(1)}°</b>`} · typical miss <b>±${dx.bias.rmse.toFixed(1)}°</b> — corrected`}
    if(tk){const y=tk.last,hit=Math.abs(y.p-y.a)<=2;
      chk+=`${dx.bias.rmse!=null?'<br>':''}Yesterday called <b>${y.p}°${y.pl!=null?' / '+y.pl+'°':''}</b>, settled <b>${y.a}°${y.al!=null?' / '+y.al+'°':''}</b>${y.src==='CLI'?' <span style="color:var(--dim)">(climate report)</span>':''} <span class="${hit?'good':'bad'}">${y.p-y.a>0?'+':''}${y.p-y.a}°</span>`;
      if(tk.n>1){chk+=` · ${tk.n}d MAE ${tk.maeHi.toFixed(1)}° high`;
        if(tk.maeLo!=null)chk+=`, ${tk.maeLo.toFixed(1)}° low`}}
    chk+=`</div>`;
  }
  let warn='';
  if(dx.drop)warn+=`<div class="warn"><b>Low not done.</b> Morning min was ${Math.round(dx.obsMin)}°, but ${Math.round(dx.drop.v)}° is forecast around ${dx.drop.hr}h — a later drop still counts for today.</div>`;
  if(dx.seam)warn+=`<div class="warn"><b>Climate-day seam.</b> Calendar midnight–midnight gives ${Math.round(dx.seam.cal)}°, the settling 1am–1am window gives ${Math.round(dx.seam.cli)}°. We use the settling window.</div>`;
  return`<div class="city">${head}
    <div class="pair">
      <div class="half hi"><u>High today</u><em>${Math.round(dx.hi.mu)}°</em>
        <div class="rng">${Math.round(dx.hi.lo)}° – ${Math.round(dx.hi.hi)}°</div></div>
      <div class="half lo"><u>Low today</u><em>${dx.lo?Math.round(dx.lo.mu)+'°':'—'}</em>
        <div class="rng">${dx.lo?Math.round(dx.lo.lo)+'° – '+Math.round(dx.lo.hi)+'°':''}</div></div>
    </div>
    ${curve(c,d)}
    <div class="now">
      <div><u>Now</u><b>${dx.obsNow!=null?Math.round(dx.obsNow)+'°':'—'}</b></div>
      <div><u>Max so far</u><b class="o">${dx.obsMax!=null?Math.round(dx.obsMax)+'°':'—'}</b></div>
      <div><u>Min so far</u><b class="c">${dx.obsMin!=null?Math.round(dx.obsMin)+'°':'—'}</b></div>
      <div><u>Dew pt</u><b>${dx.last&&dx.last.dew!=null?Math.round(dx.last.dew)+'°':'—'}</b></div>
      <div><u>Sky</u><b style="font-size:12px">${dx.last?esc(dx.last.sky):'—'}</b></div></div>
    <div class="conf"><span>${word}</span><span class="meter"><i style="width:${(agree*100).toFixed(0)}%;background:${col}"></i></span>
      <span>±${dx.hi.sigma.toFixed(1)}°/${dx.lo?dx.lo.sigma.toFixed(1):'—'}°</span></div>
    ${chk}${warn}
    <div class="days">${dx.future.map(x=>`<div class="day"><u>${dow(x.dt)}</u>
      <b>${Math.round(x.hi.mu)}°</b><i>${Math.round(x.lo.mu)}°</i></div>`).join('')}</div>
    ${wetBlock(c,d)}
  </div>`;
}
function render(){
  readPalette();
  document.getElementById('errs').innerHTML=S.errs.length
    ?`<div class="err">${S.errs.slice(0,3).map(esc).join('<br>')}${
      S.errs.some(e=>/Failed to fetch|NetworkError|Load failed/i.test(e))
      ?'<br><br>A blocked request means the browser refused a cross-origin call. Serve this over http rather than opening the file directly.':''}</div>`:'';
  const fc=document.getElementById('fCity').value;
  const fs=document.getElementById('fState').value;
  const rank=c=>{const dx=S.data[c.id]&&S.data[c.id].dx;
    if(!dx||!dx.hi)return -1;
    return (dx.hi.locked?1:0)+(dx.lo&&dx.lo.locked?1:0)};
  let rows=CITIES.filter(c=>!fc||c.id===fc).map((c,i)=>({c,i,r:rank(c)}));
  const nBoth=rows.filter(x=>x.r>=2).length, nOne=rows.filter(x=>x.r===1).length;
  if(fs==='settled')rows=rows.filter(x=>x.r>=1);
  if(fs==='play')rows=rows.filter(x=>x.r<=0);
  if(fs!=='az')rows.sort((a,b)=>(b.r-a.r)||(a.i-b.i));
  let html='',prev=null;
  for(const x of rows){
    const g=x.r>=2?'both':x.r===1?'one':'play';
    if(fs!=='az'&&fs!=='settled'&&fs!=='play'&&g!==prev){
      const label=g==='both'?'Settled — high &amp; low':g==='one'?'Settled — one side':'Still in play';
      html+=`<div class="group ${g}"><b>${label}</b><i></i></div>`;
      prev=g;
    }
    html+=card(x.c);
  }
  document.getElementById('list').innerHTML=html
    ||`<div class="msg"><b>${fs==='settled'?'Nothing settled yet':fs==='play'?'Everything is settled':'Nothing loaded'}</b>${
      fs==='settled'?'Highs lock after the peak; lows lock once nothing colder is left in the window.':'Tap refresh.'}</div>`;
  const rf=document.getElementById('rf');
  rf.disabled=S.busy;rf.textContent=S.busy?'Loading…':'Refresh';
  document.getElementById('when').innerHTML=S.ts
    ?`${S.ts.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})}<br>${S.ts.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`:'—';
  const rs=Object.values(S.data).map(d=>d.dx&&d.dx.bias&&d.dx.bias.rmse).filter(x=>x!=null);
  const locks=CITIES.map(c=>{const dx=S.data[c.id]&&S.data[c.id].dx;
    if(!dx||!dx.hi)return null;return (dx.hi.locked?1:0)+(dx.lo&&dx.lo.locked?1:0)}).filter(x=>x!=null);
  const bothN=locks.filter(x=>x>=2).length, oneN=locks.filter(x=>x===1).length;
  document.getElementById('trust').innerHTML=(locks.length
    ?`<span class="tally"><b>${bothN}</b> fully settled · <s>${oneN}</s> half settled · ${locks.length-bothN-oneN} in play</span>`:'')
    +(rs.length?`${locks.length?' &nbsp;·&nbsp; ':''}typical miss <b>±${mean(rs).toFixed(1)}°</b> after correction`:'');
  document.getElementById('foot').textContent=S.ts
    ?'Highs and lows are computed over the NWS climate day — midnight to midnight local standard time, so 1am–1am under daylight saving, which means the midnight hour still belongs to the previous day. The observed max floors the high; the observed min caps the low. A low only locks when no remaining hour can undercut it. Yesterday is graded against the NWS Daily Climate Report.':'';
}
document.getElementById('th').onclick=async()=>{
  const t=document.documentElement.dataset.theme==='light'?'dark':'light';
  applyTheme(t);await store.set('theme',t);render();
};
document.getElementById('rf').onclick=load;
CITIES.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.city;
  document.getElementById('fCity').appendChild(o)});
document.getElementById('fCity').onchange=render;
document.getElementById('fState').onchange=render;
(async()=>{
  let t=await store.get('theme');
  if(t!=='light'&&t!=='dark')
    t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  applyTheme(t);render();load();
})();
</script>
</body>
</html>
